name: Update MSFT public price

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MSFT public price
        shell: python
        run: |
          import json, urllib.request, datetime, time

          def get_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          result = None
          errors = []

          try:
              d = get_json(
                  "https://api.nasdaq.com/api/quote/MSFT/info?assetclass=stocks",
                  {
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json, text/plain, */*",
                      "Referer": "https://www.nasdaq.com/"
                  }
              )
              x = d["data"]
              status = str(x.get("marketStatus") or "")
              row = x.get("primaryData") or {}
              session = "PUBLIC MARKET PRICE"
              if any(k in status.lower() for k in ("after", "pre", "closed")) and (x.get("secondaryData") or {}).get("lastSalePrice"):
                  row = x["secondaryData"]
                  session = "LATEST REGULAR CLOSE"
              price = float(str(row["lastSalePrice"]).replace("$","").replace(",","").strip())
              result = {
                  "symbol":"MSFT",
                  "price":price,
                  "asof":row.get("lastTradeTimestamp") or datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "session":session,
                  "source":"Nasdaq public quote",
                  "updated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
              }
          except Exception as e:
              errors.append("Nasdaq: "+repr(e))

          if result is None:
              try:
                  d = get_json(
                      "https://query1.finance.yahoo.com/v8/finance/chart/MSFT?interval=1d&range=5d&includePrePost=false",
                      {"User-Agent":"Mozilla/5.0"}
                  )
                  m = d["chart"]["result"][0]["meta"]
                  price = float(m["regularMarketPrice"])
                  ts = int(m.get("regularMarketTime") or time.time())
                  result = {
                      "symbol":"MSFT",
                      "price":price,
                      "asof":datetime.datetime.fromtimestamp(ts, datetime.timezone.utc).isoformat(),
                      "session":"LATEST REGULAR PUBLIC PRICE",
                      "source":"Yahoo Finance public quote",
                      "updated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
                  }
              except Exception as e:
                  errors.append("Yahoo: "+repr(e))

          if result is None:
              raise RuntimeError("No public price source succeeded: "+" | ".join(errors))

          with open("msft-price.json","w",encoding="utf-8") as f:
              json.dump(result,f,indent=2)
              f.write("\n")

      - name: Commit updated price if changed
        run: |
          if git diff --quiet -- msft-price.json; then
            echo "No price-file change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add msft-price.json
          git commit -m "Update MSFT public price"
          git push
